name: suivi-long-terme

on:
  schedule:
    - cron: "0 6,18 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Forcer l'envoi du récap (1 = oui)"
        default: "1"

permissions:
  contents: write

concurrency:
  group: state
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Analyse long terme
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FORCE: ${{ github.event.inputs.force }}
        run: python long.py
      - name: Sauvegarder l'historique
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add long_state.json
          git diff --staged --quiet || (git commit -m "update long state" && git pull --rebase && git push)
